# SorbetDay colour scheme for qt5ct / qt6ct, part of cosmic-sorbetday-theme (MIT).
# The rice's window colour for windows, its containers for buttons and
# tooltips, its text colour, the accent as highlight with the button text
# colour on it, dim placeholders.
#
# Install: ./qt/install.sh puts this in ~/.config/qt5ct/colors/ and
# ~/.config/qt6ct/colors/. Then in qt5ct / qt6ct: Appearance -> Color scheme
# -> SorbetDay, Palette: Custom, Apply. Qt apps need QT_QPA_PLATFORMTHEME=qt5ct
# (or qt6ct) in the environment to read it.
#
# Roles, in order: WindowText, Button, Light, Midlight, Dark, Mid, Text,
# BrightText, ButtonText, Base, Window, Shadow, Highlight, HighlightedText,
# Link, LinkVisited, AlternateBase, NoRole, ToolTipBase, ToolTipText,
# PlaceholderText
[ColorScheme]
active_colors=#1b1a1b, #f4eef4, #f4eef4, #d4cad4, #e0d6e0, #e0d6e0, #1b1a1b, #ffffff, #1b1a1b, #f4eef4, #e9e2e9, #e0d6e0, #1c685c, #e9e2e9, #1c685c, #1c685c, #f4eef4, #e9e2e9, #f4eef4, #1b1a1b, #635f63
disabled_colors=#959295, #f4eef4, #f4eef4, #d4cad4, #e0d6e0, #e0d6e0, #959295, #684488, #959295, #e9e2e9, #e9e2e9, #e0d6e0, #d4cad4, #684488, #635f63, #635f63, #f4eef4, #e9e2e9, #f4eef4, #1b1a1b, #d4cad4
inactive_colors=#1b1a1b, #f4eef4, #f4eef4, #d4cad4, #e0d6e0, #e0d6e0, #1b1a1b, #ffffff, #1b1a1b, #f4eef4, #e9e2e9, #e0d6e0, #1c685c, #e9e2e9, #1c685c, #1c685c, #f4eef4, #e9e2e9, #f4eef4, #1b1a1b, #635f63
