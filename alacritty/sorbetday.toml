# SorbetDay for Alacritty, part of cosmic-sorbetday-theme (MIT).
# Colours follow the COSMIC Terminal scheme (cosmic-term/).
#
# Install: ./alacritty/install.sh puts this in ~/.config/alacritty/themes/,
# then in ~/.config/alacritty/alacritty.toml:
#   [general]
#   import = ["~/.config/alacritty/themes/sorbetday.toml"]
# (Alacritty 0.13: a top-level `import = [...]` line instead.)

[colors.primary]
background = "#E9E2E9"
foreground = "#1B1A1B"
bright_foreground = "#FFFFFF"
dim_foreground = "#635F63"

[colors.cursor]
text = "#E9E2E9"
cursor = "#1C685C"

[colors.vi_mode_cursor]
text = "#E9E2E9"
cursor = "#895125"

[colors.selection]
text = "CellForeground"
background = "#D4CAD4"

[colors.search.matches]
foreground = "#E9E2E9"
background = "#68602C"

[colors.search.focused_match]
foreground = "#E9E2E9"
background = "#1C685C"

[colors.hints.start]
foreground = "#E9E2E9"
background = "#895125"

[colors.hints.end]
foreground = "#E9E2E9"
background = "#68602C"

[colors.footer_bar]
foreground = "#1B1A1B"
background = "#F4EEF4"

[colors.line_indicator]
foreground = "None"
background = "None"

[colors.normal]
black   = "#EDE7ED"
red     = "#963653"
green   = "#2E6B29"
yellow  = "#68602C"
blue    = "#1C685C"
magenta = "#895125"
cyan    = "#3A857B"
white   = "#342D34"

[colors.bright]
black   = "#959295"
red     = "#713A4A"
green   = "#446742"
yellow  = "#4C482F"
blue    = "#1F4D46"
magenta = "#644329"
cyan    = "#684488"
white   = "#131113"

[colors.dim]
black   = "#E9E2E9"
red     = "#D62F61"
green   = "#32A429"
yellow  = "#B29D24"
blue    = "#4B5281"
magenta = "#D36D1D"
cyan    = "#42A699"
white   = "#625B62"
